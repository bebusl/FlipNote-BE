services:

  # =========================================================
  # 인프라 (MySQL, Redis, RabbitMQ)
  # =========================================================

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-flipnote_local}
    ports:
      - "3307:3306"    # DBeaver 등 GUI로 직접 붙기 위해 노출 (로컬 전용, macOS MySQL과 충돌 방지)
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-flipnote_local}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "15672:15672"    # RabbitMQ 관리 UI → http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # =========================================================
  # 애플리케이션 서비스
  # =========================================================

  user-service:
    image: ghcr.io/${GHCR_NAMESPACE:-dungbik}/flipnote-user:main
    platform: linux/amd64    # GHCR 이미지가 amd64 전용 → Apple Silicon에서는 Rosetta 에뮬레이션
    environment:
      OAUTH_BASE_URL: http://localhost:8080    # 기본값이 운영 도메인이라 로컬 OAuth 콜백용으로 덮어씀
      DB_URL: jdbc:mysql://mysql:3306/flipnote_user
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-flipnote_local}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      JWT_SECRET: ${JWT_SECRET}
      APP_RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-FlipNote <no-reply@localhost>}
      APP_CLIENT_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  image-service:
    # GHCR의 flipnote-image 패키지만 비공개(403)라 익명 pull 불가 → 로컬 소스에서 직접 빌드.
    # GHCR 접근 권한이 생기면 build 블록을 지우고 platform: linux/amd64 를 되살리면 됨.
    image: flipnote-image:local
    build:
      context: ./FlipNote-Image
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:mysql://mysql:3306/flipnote_image
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-flipnote_local}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ""
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-placeholder}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-placeholder}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-flipnote-bucket}
      S3_BUCKET_REGION: ${S3_BUCKET_REGION:-ap-northeast-2}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  reaction-service:
    image: ghcr.io/${GHCR_NAMESPACE:-dungbik}/flipnote-reaction:main
    platform: linux/amd64
    environment:
      DB_URL: jdbc:mysql://mysql:3306/flipnote_reaction
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-flipnote_local}
      DDL_AUTO: update    # 첫 실행 시 테이블 자동 생성 (기본값 validate는 첫 실행 실패)
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  group-service:
    image: ghcr.io/${GHCR_NAMESPACE:-dungbik}/flipnote-group:main
    platform: linux/amd64
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/flipnote_group
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-flipnote_local}
      GRPC_USER_URL: user-service:9091
      GRPC_IMAGE_URL: image-service:9092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-FlipNote <no-reply@localhost>}
      APP_CLIENT_URL: http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  cardset-service:
    image: ghcr.io/${GHCR_NAMESPACE:-dungbik}/flipnote-cardset:main
    platform: linux/amd64
    environment:
      NODE_ENV: production
      PORT: 8085
      GRPC_PORT: 9095
      JWT_SECRET: ${JWT_SECRET}    # WebSocket 인증 시 auth.service.ts가 직접 jwt.verify 함 — 없으면 실시간 협업 실패
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: flipnote_cardset
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-flipnote_local}
      DB_SYNCHRONIZE: "true"    # 첫 실행 시 테이블 자동 생성
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      USER_GRPC_URL: user-service:9091
      GROUP_GRPC_URL: group-service:9094
      IMAGE_GRPC_URL: image-service:9092
      GRPC_REACTION_URL: reaction-service:9093
      DEFAULT_CARDSET_IMAGE_URL: https://flipnote-bucket.s3.ap-northeast-2.amazonaws.com/image/default/cardset.png
      SKIP_WS_AUTH: "false"
      SKIP_USER_GRPC: "false"
      SKIP_REACTION_GRPC: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    image: ghcr.io/${GHCR_NAMESPACE:-dungbik}/flipnote-notification:main
    platform: linux/amd64
    environment:
      DB_URL: jdbc:mysql://mysql:3306/flipnote_notification
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-flipnote_local}
      JPA_DDL_AUTO: update    # 첫 실행 시 테이블 자동 생성
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      # 빈 값이면 FirebaseConfig의 @PostConstruct에서 IOException으로 기동 실패함. .env에 반드시 값 필요.
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:?firebase json이 .env에 없습니다}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api-gateway:
    image: ghcr.io/${GHCR_NAMESPACE:-dungbik}/flipnote-api-gateway:main
    platform: linux/amd64
    ports:
      - "8080:8080"    # 모든 API 요청은 여기로
    depends_on:
      - user-service
      - image-service
      - reaction-service
      - group-service
      - cardset-service
      - notification-service

volumes:
  mysql_data:    # MySQL 데이터 영속화 (컨테이너 재시작해도 데이터 유지)
