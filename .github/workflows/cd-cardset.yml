name: CD cardset-service

on:
  push:
    branches: [main]
    paths:
      - 'FlipNote-Cardset/**'
      - '.github/workflows/cd-cardset.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bebusl/flipnote-cardset
      - uses: docker/build-push-action@v6
        with:
          context: ./FlipNote-Cardset
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
