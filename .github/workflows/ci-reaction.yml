name: CI reaction-service

on:
  push:
    branches: [main]
    paths:
      - 'FlipNote-Reaction/**'
      - '.github/workflows/ci-reaction.yml'
  pull_request:
    branches: [main]
    paths:
      - 'FlipNote-Reaction/**'
      - '.github/workflows/ci-reaction.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./FlipNote-Reaction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build -x test
      - run: ./gradlew test
